# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: thealleghenychronicle-lab/allegheny-chronicle
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/e0fbdffc-cba8-4ec0-9c25-82a944965c85/pkce
  auth_token_endpoint: /sites/e0fbdffc-cba8-4ec0-9c25-82a944965c85/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://peaceful-kulfi-de7b70.netlify.app

media_folder: "public/images/articles"
public_folder: "/images/articles"

publish_mode: editorial_workflow

collections:
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    folder: "content/articles"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{category}} ({{date}})"
    sortable_fields: ["date", "title", "category"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Custom URL Slug (optional)"
        name: "slug"
        widget: "string"
        required: false
        hint: "Leave blank to auto-generate a keyword-rich URL from the business name + title + location."
      - { label: "Business Name", name: "businessName", widget: "string", required: false }
      - { label: "Location (neighborhood, city)", name: "location", widget: "string", required: false }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Featured Image Alt Text", name: "imageAlt", widget: "string", required: false }
      - { label: "Author", name: "author", widget: "string", default: "The Allegheny Chronicle Staff" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Excerpt (shown on cards & search)", name: "excerpt", widget: "text" }
      - { label: "Featured (homepage hero)", name: "featured", widget: "boolean", default: false }
      - { label: "Trending", name: "trending", widget: "boolean", default: false }
      - { label: "Editor's Pick", name: "editorsPick", widget: "boolean", default: false }
      - { label: "Save as Draft (hides from site)", name: "draft", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown" }
